name: Test

on: [ pull_request ]

jobs:
  test:
    runs-on: ubuntu-latest
    # A Minecraft client that fails to start can hang instead of exiting; don't burn the 6h default.
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Run Game Tests
        run: bash ./gradlew runGameTest
